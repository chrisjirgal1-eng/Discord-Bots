<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root{
    --bg:rgba(10,14,24,.92); --card:rgba(16,22,38,.96); --line:rgba(120,180,255,.16);
    --acc:#34e0ff; --acc2:#7aa2ff; --txt:#e8f0ff; --dim:#8aa0c6; --ok:#3ee08a; --bad:#ff6b81;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:transparent;font-family:"Segoe UI",system-ui,sans-serif;color:var(--txt);
    overflow:hidden;user-select:none}
  .wrap{margin:14px;border-radius:16px;background:var(--card);border:1px solid var(--line);
    box-shadow:0 24px 70px rgba(0,0,0,.6),0 0 0 1px rgba(52,224,255,.08) inset;overflow:hidden}
  .wrap.in{animation:pop .14s cubic-bezier(.2,.8,.2,1)}
  @keyframes pop{from{opacity:0;transform:scale(.97) translateY(-6px)}to{opacity:1;transform:none}}
  .bar{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
  .logo{color:var(--acc);font-size:18px;filter:drop-shadow(0 0 6px var(--acc))}
  #q{flex:1;background:transparent;border:0;outline:0;color:var(--txt);font-size:19px;
    letter-spacing:.2px}
  #q::placeholder{color:var(--dim)}
  .tbtn{background:rgba(120,160,255,.08);border:1px solid var(--line);color:var(--dim);
    font-size:11px;letter-spacing:.5px;padding:5px 9px;border-radius:8px;cursor:pointer;text-transform:uppercase}
  .tbtn.on{color:#04121a;background:var(--acc);border-color:var(--acc)}
  .body{max-height:430px;overflow-y:auto;padding:14px 18px 18px}
  .hint{color:var(--dim);font-size:13px;line-height:1.7;padding:6px 2px}
  .hint b{color:var(--acc2)}
  .parsed{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px;margin:2px 0 10px}
  .parsed b{color:var(--acc);text-transform:none;letter-spacing:0;font-size:15px;display:block;margin-top:3px}
  .step{display:flex;align-items:center;gap:11px;padding:7px 0;opacity:0;transform:translateX(-6px);
    transition:.25s}
  .step.show{opacity:1;transform:none}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--dim);flex:none;box-shadow:0 0 0 3px rgba(120,160,255,.08)}
  .step.done .dot{background:var(--ok);box-shadow:0 0 8px var(--ok)}
  .step.fail .dot{background:var(--bad);box-shadow:0 0 8px var(--bad)}
  .step .lbl{font-size:14px;color:var(--txt)}
  .step .ms{color:var(--acc);font-size:10px;margin-left:6px}
  .status{margin-top:12px;font-size:13px;color:var(--acc2);display:flex;align-items:center;gap:8px}
  .status .spin{width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--acc);
    border-radius:50%;animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .result{margin-top:10px;padding:11px 13px;border-radius:10px;background:rgba(62,224,138,.08);
    border:1px solid rgba(62,224,138,.25);font-size:14px}
  .result.bad{background:rgba(255,107,129,.08);border-color:rgba(255,107,129,.3)}
  .say{margin-top:9px;color:var(--dim);font-size:13px;font-style:italic}
  .reason{margin-top:12px;padding:10px 12px;border-radius:9px;background:rgba(0,0,0,.3);
    border:1px dashed var(--line);font:12px/1.6 "Cascadia Code",Consolas,monospace;color:var(--dim);
    white-space:pre-wrap;display:none}
  .reason.show{display:block}
  .reason .k{color:var(--acc2)}
  .hsec{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--dim);margin:4px 0 8px}
  .hitem{padding:9px 11px;border:1px solid var(--line);border-radius:9px;margin-bottom:7px;cursor:pointer;
    transition:.15s}
  .hitem:hover{border-color:var(--acc);background:rgba(52,224,255,.05)}
  .hitem .top{display:flex;justify-content:space-between;gap:10px;font-size:14px}
  .hitem .ts{color:var(--dim);font-size:12px;flex:none}
  .hitem .det{font-size:12px;color:var(--dim);margin-top:6px;display:none}
  .hitem.open .det{display:block}
  .pill{font-size:10px;padding:2px 7px;border-radius:20px;border:1px solid var(--line);color:var(--acc2)}
  .pill.bad{color:var(--bad);border-color:rgba(255,107,129,.4)}
  .body::-webkit-scrollbar{width:8px}.body::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
</style>
</head>
<body>
<div class="wrap in" id="wrap">
  <div class="bar">
    <span class="logo">◆</span>
    <input id="q" autocomplete="off" spellcheck="false"
           placeholder="Ask Zoe or type a command…  (e.g. open YouTube, check CPU, start coding)">
    <button class="tbtn" id="histBtn" title="Command history">History</button>
    <button class="tbtn" id="reasonBtn" title="Show Zoe's reasoning">Reasoning</button>
  </div>
  <div class="body" id="body"></div>
</div>
<script>
  const $ = (s) => document.querySelector(s);
  const q = $('#q'), body = $('#body'), wrap = $('#wrap');
  const histBtn = $('#histBtn'), reasonBtn = $('#reasonBtn');
  let reasoning = localStorage.getItem('zoe.reasoning') === '1';
  let busy = false;
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

  function syncReason(){ reasonBtn.classList.toggle('on', reasoning);
    document.querySelectorAll('.reason').forEach(r => r.classList.toggle('show', reasoning)); }

  function hint(){
    body.innerHTML = '<div class="hint">Type a request and press <b>Enter</b>. Voice ("hey zoe") and '
      + 'this bar run the <b>same</b> engine.<br>Try: <b>open YouTube and play lofi</b> · '
      + '<b>launch Discord</b> · <b>start coding</b> · <b>open downloads folder</b><br>'
      + '<b>Esc</b> to close · <b>Reasoning</b> shows every decision.</div>';
  }

  function renderReason(r){
    return '<div class="reason ' + (reasoning?'show':'') + '">'
      + '<span class="k">intent</span>   ' + esc(r.intent) + '\n'
      + '<span class="k">target</span>   ' + esc(r.target || '-') + '\n'
      + '<span class="k">url</span>      ' + esc(r.url || '-') + '\n'
      + '<span class="k">handled</span>  ' + r.handled + '\n'
      + '<span class="k">trace</span>    ' + esc(r.trace_id || '-') + '\n'
      + '<span class="k">source</span>   ' + esc(r.source || 'ui') + '</div>';
  }

  function render(r){
    const tr = (r.trace && r.trace.length) ? r.trace
             : (r.steps || []).map(s => ({ label: s, status: r.handled ? 'done' : 'fail', ms: 0 }));
    const steps = tr.map((s,i) =>
      '<div class="step" data-i="'+i+'"><span class="dot"></span><span class="lbl">'+esc(s.label)
      + (s.ms ? ' <span class="ms">'+s.ms+'ms</span>' : '')+'</span></div>').join('');
    body.innerHTML =
      '<div class="parsed">Understood as<b>'+esc(r.parsed||'-')+'</b></div>'
      + '<div id="steps">'+steps+'</div>'
      + '<div class="status" id="st"><span class="spin"></span> Executing…</div>'
      + renderReason(r);
    // reveal steps one by one for a live feel, each settling to its real status
    const nodes = [...body.querySelectorAll('.step')];
    nodes.forEach((n,i) => setTimeout(() => {
      n.classList.add('show'); n.classList.add(tr[i].status === 'fail' ? 'fail' : 'done');
    }, 90*(i+1)));
    setTimeout(() => {
      const ok = r.handled;
      $('#st').outerHTML =
        '<div class="result '+(ok?'':'bad')+'">'+(ok?'✓ Completed':'✕ '+esc(r.error||'Could not complete'))
        + (r.timing_ms ? ' · '+r.timing_ms+'ms' : '')+'</div>'
        + (r.say ? '<div class="say">“'+esc(r.say)+'”</div>' : '');
      syncReason();
    }, 90*(nodes.length+1)+120);
  }

  async function run(){
    const text = q.value.trim();
    if(!text || busy) return;
    busy = true;
    body.innerHTML = '<div class="status"><span class="spin"></span> Thinking…</div>';
    let r;
    try { r = await window.zoeBar.run(text); }
    catch(e){ r = { handled:false, parsed:'Error', steps:[], error:String(e), status:'failed' }; }
    render(r);
    busy = false;
  }

  async function showHistory(){
    histBtn.classList.toggle('on');
    if(!histBtn.classList.contains('on')){ hint(); return; }
    let list = [];
    try { list = await window.zoeBar.history(); } catch(e){}
    if(!list.length){ body.innerHTML = '<div class="hint">No commands yet.</div>'; return; }
    body.innerHTML = '<div class="hsec">Recent commands</div>' + list.slice().reverse().map(h =>
      '<div class="hitem"><div class="top"><span>'+esc(h.text)+'</span>'
      + '<span class="ts">'+esc(h.ts||'')+'</span></div>'
      + '<div class="det"><span class="pill '+(h.handled?'':'bad')+'">'+esc(h.action)+'</span> '
      + esc(h.summary||'') + (h.trace_id?'  ·  '+esc(String(h.trace_id).slice(0,8)):'') + '</div></div>'
    ).join('');
    body.querySelectorAll('.hitem').forEach(it =>
      it.addEventListener('click', () => it.classList.toggle('open')));
  }

  q.addEventListener('keydown', (e) => {
    if(e.key === 'Enter'){ histBtn.classList.remove('on'); run(); }
    else if(e.key === 'Escape'){ window.zoeBar.hide(); }
  });
  reasonBtn.addEventListener('click', () => {
    reasoning = !reasoning; localStorage.setItem('zoe.reasoning', reasoning?'1':'0'); syncReason();
  });
  histBtn.addEventListener('click', showHistory);
  document.addEventListener('keydown', (e) => { if(e.key === 'Escape') window.zoeBar.hide(); });

  function reset(){ q.value=''; histBtn.classList.remove('on'); hint();
    wrap.classList.remove('in'); void wrap.offsetWidth; wrap.classList.add('in'); q.focus(); }
  window.zoeBar.onShow(reset);
  syncReason(); hint(); q.focus();
</script>
</body>
</html>
