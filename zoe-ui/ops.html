<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZOE Ops Loop</title>
<style>
  :root{ --p:#9333ea; --p2:#b46bff; --bg:#08050f; --pan:#0e0818; --ln:rgba(147,51,234,.22);
         --tx:#e9dcff; --dm:#8b7bb0; --gold:#ffb24d; --grn:#5be39a; --red:#ff6b81; }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%;background:var(--bg);color:var(--tx);font-family:"Segoe UI",system-ui,sans-serif}
  body{display:flex;flex-direction:column;height:100vh;overflow:hidden}
  header{display:flex;align-items:center;gap:12px;padding:16px 22px;border-bottom:1px solid var(--ln)}
  header .ic{font-size:20px;color:var(--p2);text-shadow:0 0 12px var(--p)}
  header h1{font-size:15px;letter-spacing:2px;font-weight:800}
  .pill{font-size:10px;letter-spacing:1px;padding:3px 10px;border-radius:20px;border:1px solid var(--ln)}
  .pill.on{color:var(--grn);border-color:rgba(91,227,154,.4);box-shadow:0 0 10px rgba(91,227,154,.18)}
  .pill.off{color:var(--dm)}
  .sub{margin-left:auto;font-size:11px;color:var(--dm);letter-spacing:.5px;text-align:right;line-height:1.5}
  .bar{display:flex;gap:10px;padding:14px 22px;border-bottom:1px solid var(--ln);flex-wrap:wrap}
  button{font:inherit;font-size:12px;letter-spacing:.5px;color:var(--tx);background:rgba(147,51,234,.12);
    border:1px solid var(--ln);border-radius:9px;padding:9px 16px;cursor:pointer;transition:.15s}
  button:hover{background:rgba(147,51,234,.24);border-color:var(--p2)}
  button:disabled{opacity:.5;cursor:default}
  button.primary{background:rgba(147,51,234,.28);border-color:var(--p2)}
  .wrap{flex:1;overflow:auto;padding:18px 22px;display:flex;flex-direction:column;gap:16px}
  .card{background:var(--pan);border:1px solid var(--ln);border-radius:14px;padding:16px 18px}
  .card h2{font-size:11px;letter-spacing:1.5px;color:var(--dm);font-weight:700;margin-bottom:10px;text-transform:uppercase}
  .badge{display:inline-block;font-size:10px;font-weight:800;letter-spacing:1px;padding:2px 9px;border-radius:6px}
  .badge.PASS{color:var(--grn);background:rgba(91,227,154,.12)}
  .badge.NEEDS-WORK{color:var(--gold);background:rgba(255,178,77,.12)}
  .badge.ERROR{color:var(--red);background:rgba(255,107,129,.12)}
  .result{white-space:pre-wrap;font-size:13px;line-height:1.55;margin-top:10px;color:#f1e9ff}
  .verdict{margin-top:12px;padding-top:10px;border-top:1px dashed var(--ln);font-size:12px;color:var(--dm);white-space:pre-wrap}
  .spoken{margin:10px 0;padding:10px 13px;border-left:2px solid var(--gold);background:rgba(255,178,77,.07);
    color:var(--gold);font-style:italic;font-size:13px;line-height:1.55;border-radius:0 8px 8px 0;white-space:pre-wrap}
  .meta{font-size:10px;color:#6f6790;letter-spacing:.5px;margin-top:8px}
  .hist{display:flex;flex-direction:column;gap:2px}
  .row{display:grid;grid-template-columns:74px 92px 1fr;gap:10px;padding:9px 6px;border-bottom:1px solid rgba(147,51,234,.08);
    font-size:12px;align-items:center;cursor:pointer}
  .row:hover{background:rgba(147,51,234,.06)}
  .row .t{color:var(--dm);font-size:11px}
  .row .task{color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .empty{color:var(--dm);font-size:12px;padding:8px 0}
  .task-line{font-size:12px;color:var(--dm);margin-top:4px;line-height:1.5}
</style>
</head>
<body>
<header>
  <span class="ic">&#8635;</span>
  <h1>OPS LOOP</h1>
  <span id="pill" class="pill off">&middot;&middot;&middot;</span>
  <div class="sub" id="sub">loading&hellip;</div>
</header>
<div class="bar">
  <button class="primary" id="run">&#9654; Run now</button>
  <button id="pause">Pause</button>
  <button id="edit">Edit task</button>
  <button id="speak">&#128266; Speak: off</button>
  <button id="refresh">Refresh</button>
</div>
<div class="wrap">
  <div class="card">
    <h2>Last run</h2>
    <div id="last"><div class="empty">No runs yet. Hit Run now.</div></div>
    <div class="task-line" id="curtask"></div>
  </div>
  <div class="card">
    <h2>History</h2>
    <div class="hist" id="hist"><div class="empty">Nothing yet.</div></div>
  </div>
</div>
<script>
  const $ = s => document.querySelector(s);
  let RUNS = [];

  function esc(s){ return (s||"").replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
  function fmtTs(ts){ try { const d=new Date(ts); return d.toLocaleString([], {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}); } catch(e){ return ts||""; } }

  function renderLast(r){
    if(!r){ $("#last").innerHTML = '<div class="empty">No runs yet. Hit Run now.</div>'; return; }
    const spoken = r.spoken ? `<div class="spoken">&#128483; ${esc(r.spoken)}</div>` : "";
    const body = r.status === "ERROR"
      ? `<div class="result" style="color:var(--red)">${esc(r.error)}</div>`
      : `${spoken}<div class="result">${esc(r.result)}</div><div class="verdict">${esc(r.verdict)}</div>`;
    $("#last").innerHTML =
      `<span class="badge ${r.status}">${r.status}</span> `+
      `<span class="meta">${fmtTs(r.ts)} &middot; ${esc(r.engine||"")} &middot; ${r.secs||0}s</span>`+
      body;
  }

  function renderHist(){
    if(!RUNS.length){ $("#hist").innerHTML = '<div class="empty">Nothing yet.</div>'; return; }
    $("#hist").innerHTML = RUNS.map((r,i) =>
      `<div class="row" data-i="${i}"><span class="t">${fmtTs(r.ts)}</span>`+
      `<span class="badge ${r.status}">${r.status}</span>`+
      `<span class="task">${esc(r.task)}</span></div>`).join("");
    document.querySelectorAll(".row").forEach(el =>
      el.addEventListener("click", () => renderLast(RUNS[+el.dataset.i])));
  }

  async function loadStatus(){
    try{
      const s = await (await fetch("/ops/status")).json();
      const on = !s.paused;
      $("#pill").className = "pill " + (on ? "on" : "off");
      $("#pill").textContent = on ? "ARMED" : "PAUSED";
      $("#pause").textContent = on ? "Pause" : "Resume";
      $("#speak").textContent = (s.speak ? "🔊" : "🔈") + " Speak: " + (s.speak ? "on" : "off");
      $("#speak").classList.toggle("primary", !!s.speak);
      $("#sub").innerHTML = `next run: ${esc(s.next_run||"")} &middot; ${esc(s.engine||"")} &middot; budget ${s.max_tokens||"?"} tok`;
      $("#curtask").textContent = "Task: " + (s.task||"");
      if(s.last) renderLast(s.last);
    }catch(e){ $("#sub").textContent = "server offline"; }
  }
  async function loadLog(){
    try{
      const d = await (await fetch("/ops/log")).json();
      RUNS = d.runs || []; renderHist();
    }catch(e){}
  }
  async function refresh(){ await loadStatus(); await loadLog(); }

  $("#run").addEventListener("click", async () => {
    const b = $("#run"); b.disabled = true; b.textContent = "Running…";
    try{
      const r = await (await fetch("/ops/run", {method:"POST", headers:{"Content-Type":"application/json"}, body:"{}"})).json();
      renderLast(r); await loadLog(); await loadStatus();
    }catch(e){ alert("Run failed: " + e); }
    b.disabled = false; b.textContent = "▶ Run now";
  });
  $("#pause").addEventListener("click", async () => {
    const s = await (await fetch("/ops/status")).json();
    await fetch("/ops/config", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({paused: !s.paused})});
    loadStatus();
  });
  $("#edit").addEventListener("click", async () => {
    const s = await (await fetch("/ops/status")).json();
    const t = prompt("Ops loop task (what it drafts each run):", s.task || "");
    if(t && t.trim()){ await fetch("/ops/config", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({task: t.trim()})}); loadStatus(); }
  });
  $("#speak").addEventListener("click", async () => {
    const s = await (await fetch("/ops/status")).json();
    await fetch("/ops/config", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({speak: !s.speak})});
    loadStatus();
  });
  $("#refresh").addEventListener("click", refresh);

  refresh();
  setInterval(loadStatus, 12000);
</script>
</body>
</html>
